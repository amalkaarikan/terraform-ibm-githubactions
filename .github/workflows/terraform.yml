name: Terraform IBM Cloud - Custom Run

on:
  workflow_dispatch:
    inputs:
      steps_to_run:
        description: "Select which Terraform steps to execute (comma-separated)"
        required: true
        default: "init,plan"
      region:
        description: "IBM Cloud region"
        required: true
        default: "us-south"
      environment:
        description: "Environment name (dev/stage/prod)"
        required: true
        default: "dev"

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_ibmcloud_api_key: ${{ secrets.IBM_CLOUD_API_KEY }}
      TF_VAR_region: ${{ github.event.inputs.region }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Display selected steps
        run: echo "Steps selected: ${{ github.event.inputs.steps_to_run }}"

      - name: Terraform Init
        if: contains(github.event.inputs.steps_to_run, 'init')
        run: terraform init

      - name: Terraform Validate
        if: contains(github.event.inputs.steps_to_run, 'validate')
        run: terraform validate

      - name: Terraform Plan
        if: contains(github.event.inputs.steps_to_run, 'plan')
        run: terraform plan -var "region=${{ github.event.inputs.region }}" -out=tfplan

      - name: Terraform Apply
        if: contains(github.event.inputs.steps_to_run, 'apply')
        run: terraform apply -auto-approve -var "region=${{ github.event.inputs.region }}"

      - name: Terraform Destroy
        if: contains(github.event.inputs.steps_to_run, 'destroy')
        run: terraform destroy -auto-approve -var "region=${{ github.event.inputs.region }}"
