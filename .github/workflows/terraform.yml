name: Terraform IBM Cloud - Parameterized

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "plan"
        type: choice
        options:
          - init
          - plan
          - apply
          - destroy
      region:
        description: "IBM Cloud region"
        required: true
        default: "us-south"
      environment:
        description: "Environment (dev/stage/prod)"
        required: true
        default: "dev"

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_ibmcloud_api_key: ${{ secrets.IBM_CLOUD_API_KEY }}
      TF_VAR_region: ${{ github.event.inputs.region }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        if: ${{ github.event.inputs.action == 'init' }}
        run: terraform init

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'plan' }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -var "region=${{ github.event.inputs.region }}" -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -var "region=${{ github.event.inputs.region }}"

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -var "region=${{ github.event.inputs.region }}"
