name: Terraform IBM Cloud - Parameterized

on:
  workflow_dispatch:
    inputs:
      steps_to_run:
        description: "Comma-separated Terraform steps to execute (init,validate,plan,apply,destroy)"
        required: true
        default: "init,plan"
      region:
        description: "IBM Cloud region"
        required: true
        default: "global"
      environment:
        description: "Environment name (dev/stage/prod)"
        required: true
        default: "dev"

jobs:
  terraform:
    name: Terraform - ${{ github.event.inputs.steps_to_run }}
    runs-on: ubuntu-latest
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_VAR_region: ${{ github.event.inputs.region }}
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      IBMCLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Display selected steps
        run: |
          echo "Steps selected: ${{ github.event.inputs.steps_to_run }}"
          echo "Region: ${{ github.event.inputs.region }}"
          echo "Environment: ${{ github.event.inputs.environment }}"

      # ---------------------------
      # Terraform Init
      # ---------------------------
      - name: Terraform Init
        if: contains(github.event.inputs.steps_to_run, 'init')
        run: |
          echo "Initializing Terraform..."
          echo "IBMCLOUD_API_KEY=${{ secrets.IBM_CLOUD_API_KEY }}" >> $GITHUB_ENV
          terraform init -input=false

      # ---------------------------
      # Terraform Validate
      # ---------------------------
      - name: Terraform Validate
        if: contains(github.event.inputs.steps_to_run, 'validate')
        run: |
          echo "Validating Terraform code..."
          terraform validate

      # ---------------------------
      # Terraform Plan
      # ---------------------------
      - name: Terraform Plan
        if: contains(github.event.inputs.steps_to_run, 'plan')
        run: |
          echo "Running terraform plan..."
          terraform plan \
            -var "ibmcloud_api_key=${{ secrets.IBM_CLOUD_API_KEY }}" \
            -var "region=${{ github.event.inputs.region }}" \
            -out=tfplan

      # ---------------------------
      # Terraform Apply
      # ---------------------------
      - name: Terraform Apply
        if: contains(github.event.inputs.steps_to_run, 'apply')
        run: |
          echo "Running terraform apply..."
          terraform apply -auto-approve \
            -var "ibmcloud_api_key=${{ secrets.IBM_CLOUD_API_KEY }}" \
            -var "region=${{ github.event.inputs.region }}"

      # ---------------------------
      # Terraform Destroy
      # ---------------------------
      - name: Terraform Destroy
        if: contains(github.event.inputs.steps_to_run, 'destroy')
        run: |
          echo "Running terraform destroy..."
          terraform destroy -auto-approve \
            -var "ibmcloud_api_key=${{ secrets.IBM_CLOUD_API_KEY }}" \
            -var "region=${{ github.event.inputs.region }}"
